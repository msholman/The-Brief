name: Update job listings

# Runs the scraper automatically every morning, plus a manual "Run" button.
on:
  schedule:
    # 11:00 UTC = 6:00 AM US Eastern (adjust the hour if you like).
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        run: python scraper.py

      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "Update job listings ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          git push
